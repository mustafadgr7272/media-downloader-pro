name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp

      - name: Build iOS IPA & Appetize Simulator
        run: |
          flet build ipa --product "Media Downloader Pro" --project "media_downloader_pro" --yes --verbose || true

          FLUTTER_BIN=$(find ~ -name "flutter" -type f -path "*/bin/flutter" 2>/dev/null | head -n 1)
          PROJ_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR=$(find /tmp -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; 2>/dev/null | head -n 1)
          fi

          mkdir -p output_ios
          if [ -n "$FLUTTER_BIN" ] && [ -n "$PROJ_DIR" ]; then
            cd "$PROJ_DIR"
            # 1. Gerçek iPhone için IPA
            "$FLUTTER_BIN" build ios --release --no-codesign
            APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r "$GITHUB_WORKSPACE/output_ios/media_downloader_pro.ipa" Payload

            # 2. Appetize.io için Simulator ZIP (--debug modu)
            "$FLUTTER_BIN" build ios --simulator --debug
            SIM_APP=$(find build/ios/iphonesimulator -name "*.app" | head -n 1)
            SIM_DIR=$(dirname "$SIM_APP")
            SIM_NAME=$(basename "$SIM_APP")
            cd "$SIM_DIR"
            zip -r "$GITHUB_WORKSPACE/output_ios/Appetize_Simulator.zip" "$SIM_NAME"
          else
            exit 1
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderPro-iOS-Builds
          path: output_ios/*
