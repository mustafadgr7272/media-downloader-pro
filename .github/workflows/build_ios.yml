name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp

      - name: Build iOS App / IPA
        run: |
          flet build ipa --product "Media Downloader Pro" --project "media_downloader_pro" --build-args="--no-codesign" --yes --verbose || true
          mkdir -p output_ipa
          if ls build/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ipa/*.ipa output_ipa/
          else
            APP_PATH=$(find build -name "*.app" -path "*/iphoneos/*" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              mkdir -p Payload
              cp -r "$APP_PATH" Payload/
              zip -r output_ipa/media_downloader_pro.ipa Payload
            else
              echo "iOS build çıktısı bulunamadı!"
              exit 1
            fi
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderPro-iOS-IPA
          path: output_ipa/*.ipa
