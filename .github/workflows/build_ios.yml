name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp

      - name: Build iOS App / IPA (Unsigned)
        run: |
          # Flet CLI'ın kendi Flutter SDK'sını kurmasını ve geçici Flutter projesini hazırlamasını sağla
          flet build ipa --product "Media Downloader Pro" --project "media_downloader_pro" --yes --verbose || true

          # Flet'in hazırladığı Flutter SDK ve proje klasörünü bul
          FLUTTER_BIN=$(find ~ -name "flutter" -type f -path "*/bin/flutter" 2>/dev/null | head -n 1)
          PROJ_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR=$(find /tmp -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; 2>/dev/null | head -n 1)
          fi

          echo "Flutter: $FLUTTER_BIN"
          echo "Proje Dizini: $PROJ_DIR"

          # Eğer doğrudan .ipa oluşmadıysa projeyi imzasız derleyip Payload -> .ipa yap
          mkdir -p output_ipa
          if ls build/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ipa/*.ipa output_ipa/
          elif [ -n "$FLUTTER_BIN" ] && [ -n "$PROJ_DIR" ]; then
            cd "$PROJ_DIR"
            "$FLUTTER_BIN" build ios --release --no-codesign
            APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r "$GITHUB_WORKSPACE/output_ipa/media_downloader_pro.ipa" Payload
          else
            echo "Flutter projesi veya SDK bulunamadı!"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderPro-iOS-IPA
          path: output_ipa/*.ipa
